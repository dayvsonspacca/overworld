# Overworld's kitty. Its colors are the theme worn: Dye writes them to
# overworld.conf whenever a theme is applied and signals kitty to reload.

font_family             JetBrainsMono Nerd Font
font_size               11.0

window_padding_width    10
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell       no

cursor_shape            beam
cursor_blink_interval   0

scrollback_lines        10000

tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     round

globinclude overworld.conf

# Settings for this machine only, kept untracked next to this file.
globinclude kitty.local.conf
